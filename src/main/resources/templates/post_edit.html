


<!-- post_edit.html -->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Post</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.16/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans">
<div class="max-w-3xl mx-auto my-10 bg-white shadow-lg rounded-lg p-8">
    <a th:href="@{/}" class="text-blue-500 hover:text-blue-700 mb-4 inline-block">Home</a>
    <h1 class="text-2xl font-bold mb-6">Update Post</h1>
    <form th:action="@{'/posts/{id}'(id=${post.id})}" th:object="${post}" method="post" class="space-y-4">
        <input type="hidden" th:field="*{createdAt}" />
        <div>
            <label for="new-post-title" class="block font-medium mb-1">Title</label>
            <input id="new-post-title" type="text" th:field="*{title}" class="w-full border-gray-300 rounded-md shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50" placeholder="Title" />
        </div>
        <div>
            <label for="new-post-body" class="block font-medium mb-1">Body</label>
            <textarea id="new-post-body" th:field="*{body}" class="w-full border-gray-300 rounded-md shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50" rows="6" placeholder="Post content"></textarea>
        </div>
        <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:ring focus:ring-blue-200 focus:ring-opacity-50">
            Update Post
        </button>
    </form>
</div>
</body>
</html>
