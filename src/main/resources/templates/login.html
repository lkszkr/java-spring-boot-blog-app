<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.16/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans">
<div class="max-w-md mx-auto my-10 bg-white shadow-lg rounded-lg p-8">
    <h1 class="text-2xl font-bold mb-6">Login</h1>
    <a th:href="@{/}" class="text-blue-500 hover:text-blue-700 mb-4 inline-block">Home</a>

    <!-- Flash Message for Login Error -->
    <div th:if="${loginError}" class="bg-red-500 text-white p-2 rounded mb-4">
        <p th:text="${loginError}"></p>
    </div>

    <form th:action="@{/login}" method="post" class="space-y-4">
        <div>
            <label for="email" class="block font-medium mb-1">Email</label>
            <input id="email" type="email" name="email" class="w-full border-gray-300 rounded-md shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50" placeholder="Email" />
        </div>
        <div>
            <label for="password" class="block font-medium mb-1">Password</label>
            <input id="password" type="password" name="password" class="w-full border-gray-300 rounded-md shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50" placeholder="Password" />
        </div>
        <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:ring focus:ring-blue-200 focus:ring-opacity-50">
            Login
        </button>
    </form>
</div>
</body>
</html>
