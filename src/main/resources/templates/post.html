<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.16/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans">
<div class="max-w-3xl mx-auto my-10 bg-white shadow-lg rounded-lg p-8">
    <a th:href="@{/}" class="text-blue-500 hover:text-blue-700 mb-4 inline-block">Home</a>

    <!-- Flash Message Display -->
    <div th:if="${errorMessage}" class="bg-red-500 text-white p-4 rounded mb-4">
        <p th:text="${errorMessage}"></p>
    </div>

    <div class="border-b pb-4 mb-4">
        <h1 class="text-2xl font-bold" th:text="${post.title}">Title</h1>
        <p class="text-gray-500" th:text="'Written by ' + ${post.account.firstName}">Account First Name</p>
        <p class="text-gray-500" th:text="'Published at ' + ${post.createdAt}">Created At</p>
        <p class="text-gray-500" th:text="'Updated at ' + ${post.updatedAt}">Updated At</p>
    </div>

    <div class="prose" th:text="${post.body}">Body text</div>
    <div class="mt-4" sec:authorize="isAuthenticated()">
        <a th:href="@{'/posts/' + ${post.id} + '/edit'}" class="text-blue-500 hover:text-blue-700 mr-4">Edit</a>
        <a th:href="@{'/posts/' + ${post.id} + '/delete'}" class="text-red-500 hover:text-red-700">Delete</a>
    </div>
</div>
</body>
</html>
